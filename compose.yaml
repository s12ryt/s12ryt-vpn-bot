name: s12ryt-vpn-bot

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-s12ryt_vpn}
      POSTGRES_USER: ${POSTGRES_USER:-s12ryt_vpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  init-permissions:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-ec", "chown -R 65532:65532 /core /run/s12ryt /traffic /backups && chmod 0750 /core /run/s12ryt /traffic /backups"]
    volumes:
      - core-config:/core
      - core-control:/run/s12ryt
      - traffic-spool:/traffic
      - backups:/backups
    read_only: true
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-s12ryt-vpn-bot:local}
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    environment:
      APP_MASTER_KEY: ${APP_MASTER_KEY:?set APP_MASTER_KEY}
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      OWNER_TG_ID: ${OWNER_TG_ID:?set OWNER_TG_ID}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?set WEB_PUBLIC_URL}
      WEB_IP: ${WEB_IP:-0.0.0.0}
      PORT: ${PORT:-35699}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CORE_CONTROL_SOCKET: /run/s12ryt/core-control.sock
      SINGBOX_CONFIG_PATH: /var/lib/s12ryt/sing-box/config.json
      TRAFFIC_SPOOL_PATH: /var/lib/s12ryt/traffic/pending.json
      WEB_ASSET_DIR: /srv/s12ryt/web
    volumes:
      - core-config:/var/lib/s12ryt/sing-box
      - core-control:/run/s12ryt
      - traffic-spool:/var/lib/s12ryt/traffic
      - backups:/var/lib/s12ryt/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: ${BACKUP_IMAGE:-s12ryt-vpn-backup:local}
    entrypoint: ["/usr/local/bin/backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    environment:
      APP_MASTER_KEY: ${APP_MASTER_KEY:?set APP_MASTER_KEY}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BACKUP_DIR: /var/lib/s12ryt/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backups:/var/lib/s12ryt/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  core-controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
      args:
        SINGBOX_IMAGE: ${SINGBOX_IMAGE:?set SINGBOX_IMAGE to an immutable version or digest}
    image: ${CONTROLLER_IMAGE:-s12ryt-vpn-core-controller:local}
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      CORE_CONTROL_SOCKET: /run/s12ryt/core-control.sock
      SINGBOX_CONFIG_PATH: /var/lib/s12ryt/sing-box/config.json
      SINGBOX_BINARY: /usr/local/bin/sing-box
      SINGBOX_CONTAINER: s12ryt-sing-box
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID to the Docker socket group ID}
    volumes:
      - core-config:/var/lib/s12ryt/sing-box
      - core-control:/run/s12ryt
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true

  sing-box:
    image: ${SINGBOX_IMAGE:?set SINGBOX_IMAGE to an immutable version or digest}
    container_name: s12ryt-sing-box
    restart: unless-stopped
    network_mode: host
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    command: ["run", "-c", "/var/lib/s12ryt/sing-box/config.json"]
    volumes:
      - core-config:/var/lib/s12ryt/sing-box:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  core-config:
  core-control:
  traffic-spool:
  backups:
